name: CI Artextilo

on:
  push:
    branches:
      - main
      - develop
      - Develop
      - 'feature/**'
      - 'Feature/**'
  pull_request:
    branches:
      - main
      - develop
      - Develop

jobs:
  frontend-build:
    name: Frontend · Build & Verificación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar Frontend para producción
        run: npm run build

  backend-check:
    name: Backend · Sintaxis & Carga
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del Backend
        run: npm install

      - name: Verificar sintaxis de todos los archivos JavaScript
        run: find src -name "*.js" -exec node --check {} +

      - name: Probar importación y montaje del servidor Express
        env:
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: artextilo_db
          JWT_SECRET: ci_test_secret_key
          CLIENT_ORIGIN: http://localhost:5173
        run: node -e "import('./src/app.js').then(() => { console.log('✅ Express App montada exitosamente'); process.exit(0); }).catch(err => { console.error('❌ Error al cargar app:', err); process.exit(1); })"

  database-check:
    name: Database · Schema & Seeds
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar servicio MySQL en el runner
        run: |
          sudo systemctl start mysql
          sudo mysql -e "CREATE USER IF NOT EXISTS 'artextilo'@'localhost' IDENTIFIED BY 'artextilo'; GRANT ALL PRIVILEGES ON *.* TO 'artextilo'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Probar ejecución de schema.sql
        run: |
          sudo mysql < database/schema.sql

      - name: Probar ejecución de seed.sql
        run: |
          sudo mysql artextilo_db < database/seed.sql

      - name: Validar integridad de tablas y registros iniciales
        run: |
          sudo mysql artextilo_db -e "
            SHOW TABLES;
            SELECT COUNT(*) AS roles_registrados FROM rol;
            SELECT COUNT(*) AS sucursales_registradas FROM sucursal;
            SELECT COUNT(*) AS empleados_registrados FROM empleado;
          "