name: CI Artextilo

on:
  push:
    branches:
      - main
      - develop
      - Develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - Develop

jobs:
  frontend-build:
    name: Frontend · Build & Verificación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: npm ci

      - name: Compilar Frontend para producción
        run: npm run build

  backend-check:
    name: Backend · Sintaxis & Carga
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        run: npm ci

      - name: Verificar sintaxis de todos los archivos JavaScript
        run: find src -name "*.js" -exec node --check {} +

      - name: Probar importación y montaje del servidor Express
        env:
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: artextilo
          DB_PASSWORD: artextilo
          DB_NAME: artextilo_db
          JWT_SECRET: ci_test_secret_key
          CLIENT_ORIGIN: http://localhost:5173
        run: node -e "import('./src/app.js').then(() => { console.log('✅ Express App montada exitosamente'); process.exit(0); }).catch(err => { console.error('❌ Error al cargar app:', err); process.exit(1); })"

  database-check:
    name: Database · Schema & Seeds
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: artextilo_db
          MARIADB_USER: artextilo
          MARIADB_PASSWORD: artextilo
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb-initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente MariaDB / MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client || sudo apt-get install -y default-mysql-client

      - name: Probar ejecución de schema.sql
        run: |
          mariadb -h 127.0.0.1 -P 3306 -u root -proot artextilo_db < database/schema.sql

      - name: Probar ejecución de seed.sql
        run: |
          mariadb -h 127.0.0.1 -P 3306 -u artextilo -partextilo artextilo_db < database/seed.sql

      - name: Validar integridad de tablas y registros iniciales
        run: |
          mariadb -h 127.0.0.1 -P 3306 -u artextilo -partextilo artextilo_db -e "
            SHOW TABLES;
            SELECT COUNT(*) AS roles_registrados FROM rol;
            SELECT COUNT(*) AS sucursales_registradas FROM sucursal;
            SELECT COUNT(*) AS empleados_registrados FROM empleado;
          "