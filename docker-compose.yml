services:
  db:
    image: mariadb:11
    container_name: artextilo-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: artextilo_db
      MARIADB_USER: artextilo
      MARIADB_PASSWORD: artextilo
    ports:
      - "3306:3306"
    volumes:
      - artextilo_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artextilo_db_data:
