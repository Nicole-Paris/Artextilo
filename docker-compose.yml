services:
  db:
    image: elisasc/artextilodb:3.0
    container_name: artextilo-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: Parde4
      MARIADB_DATABASE: artextilo_db
      MARIADB_USER: artextilo
      MARIADB_PASSWORD: artextilo
    ports:   
    - 3307:3306
    volumes:
      - artextilo_db_data:/var/lib/mysql
volumes:
  artextilo_db_data: